version: "3.8"

services:
  backend:
    build: backend
    container_name: backend
    expose:
      - "8000/tcp"
    networks:
      - project-network
    volumes:
      - static_volume:/app/static
    env_file:
      - .env
    environment:
      - STATIC_ROOT=/app/static
      - STATIC_URL=/static/
    healthcheck:
      test: [ "CMD-SHELL", "python /checkhealth.py" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    #
  nginx:
    image: nginx:alpine
    container_name: backend_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - project-network
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - static_volume:/app/static:ro
    depends_on:
      - backend

networks:
  project-network:
    driver: bridge

volumes:
  static_volume:
