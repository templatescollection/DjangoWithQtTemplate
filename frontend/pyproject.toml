[project]
name = "frontend"
version = "0.1.0"
description = "PySide6 frontend for Django backend"
readme = "README.md"
authors = [{ name = "Hassan Pouralijan", email = "pouralijan@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["pyside6>=6.10.1", "qt-material>=2.17", "requests>=2.32.5"]

[project.scripts]
frontend = "frontend.application:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"